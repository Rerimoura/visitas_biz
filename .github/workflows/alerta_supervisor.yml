name: Alerta ao supervisor — vendedores sem visita no dia

on:
  schedule:
    # 03:00 UTC = 00:00 BRT (Brasil não observa horário de verão), todo dia —
    # o próprio script pula sábado/domingo (verifica sempre o dia anterior,
    # já que à meia-noite date.today() é o dia novo, não o que terminou)
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  alerta:
    # Runner self-hosted (rodando nesta máquina, dentro da rede da Aliança) —
    # necessário porque o servidor de e-mail (zimbra.aliancanet.com.br) não
    # aceita conexões de fora da rede corporativa, e os runners hospedados
    # pelo GitHub (ubuntu-latest) tomavam connection timeout no SMTP.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar checagem e enviar alertas
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USUARIO: ${{ secrets.SMTP_USUARIO }}
          SMTP_SENHA: ${{ secrets.SMTP_SENHA }}
        run: python scripts/alerta_supervisor.py
